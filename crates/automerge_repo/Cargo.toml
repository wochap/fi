[package]
name = "automerge-repo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Actor-owned Automerge repository and peer replication core"

[lib]
name = "automerge_repo"
path = "src/lib.rs"

[dependencies]
async-trait = "0.1"
automerge = "=0.11.0"
bytes = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "macros", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "test-util"] }
tempfile = "3"
