[package]
name = "fi-repo"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
description = "Actor-owned Automerge repository and peer replication core"

[lib]
name = "fi_repo"
path = "src/lib.rs"

[dependencies]
async-trait = "0.1"
automerge = "=0.11.0"
bytes = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "macros", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "test-util"] }
tempfile = "3"
