[workspace]
resolver = "2"
members = [
    "crates/automerge_repo",
    "crates/app_core",
    "crates/app_bridge",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"

[workspace.dependencies]
automerge-repo = { path = "crates/automerge_repo" }
async-trait = "=0.1.92"
automerge = "=0.11.0"
bytes = "=1.12.1"
data-encoding = "=2.11.1"
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["alloc", "pkcs8", "rand_core", "zeroize"] }
hex = "=0.4.3"
hkdf = "=0.12.4"
hmac = "=0.12.1"
mdns-sd = "=0.21.2"
quinn = { version = "=0.11.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rand_core = { version = "=0.6.4", features = ["getrandom"] }
rcgen = { version = "=0.14.5", default-features = false, features = ["crypto", "ring"] }
rusqlite = { version = "=0.37.0", features = ["bundled"] }
rustls = { version = "=0.23.43", default-features = false, features = ["ring", "std"] }
secret-service = { version = "=4.0.0", default-features = false, features = ["rt-tokio-crypto-rust"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
subtle = "=2.6.1"
thiserror = "=2.0.20"
tokio = { version = "=1.53.1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.20", features = ["fmt", "json"] }
uuid = { version = "=1.26.0", features = ["serde", "v7"] }
tempfile = "=3.27.0"
flutter_rust_bridge = "=2.12.0"
zeroize = { version = "=1.9.0", features = ["zeroize_derive"] }
x509-parser = { version = "=0.18.0", default-features = false, features = ["verify"] }
