<?xml version="1.0" encoding="UTF-8"?>
<!-- fi app icon, master source. 1024x1024. Render with scripts/generate-icons.sh.
     The Fi tile mark (see FiLogoTile): a surface tile holding a 2x2 grid of rounded cells,
     the bottom-right one accent. The design's 100-unit box scaled x10.24, Mocha colors. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <g transform="scale(10.24)">
    <rect x="1" y="1" width="98" height="98" rx="23" fill="#313244" stroke="#CDD6F4" stroke-opacity="0.18" stroke-width="2"/>
    <g fill="none" stroke="#CDD6F4" stroke-opacity="0.75" stroke-width="5">
      <rect x="24" y="24" width="23" height="23" rx="6"/>
      <rect x="53" y="24" width="23" height="23" rx="6"/>
      <rect x="24" y="53" width="23" height="23" rx="6"/>
    </g>
    <rect x="53" y="53" width="23" height="23" rx="6" fill="#251E2D" stroke="#CBA6F7" stroke-width="5"/>
  </g>
</svg>
