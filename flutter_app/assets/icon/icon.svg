<?xml version="1.0" encoding="UTF-8"?>
<!-- fi app icon, master source. 1024x1024. Render with scripts/generate-icons.sh. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- tile -->
  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="224" fill="url(#sheen)"/>

  <!-- stacked collection cards behind the monogram -->
  <g fill="#ffffff" fill-opacity="0.10">
    <rect x="232" y="236" width="608" height="600" rx="72" transform="rotate(-8 536 536)"/>
    <rect x="232" y="236" width="608" height="600" rx="72" transform="rotate(4 536 536)"/>
  </g>

  <!-- "fi" monogram -->
  <g fill="none" stroke="#ffffff" stroke-width="96" stroke-linecap="round" stroke-linejoin="round" transform="translate(12 8)">
    <!-- f -->
    <path d="M 545 320 A 120 120 0 0 0 425 440 V 740"/>
    <path d="M 340 520 H 560"/>
    <!-- i -->
    <path d="M 660 520 V 740"/>
  </g>
  <!-- i dot: a record cell, accent colour -->
  <rect x="618" y="322" width="108" height="108" rx="30" fill="#fbbf24"/>
</svg>
