<?xml version="1.0" encoding="UTF-8"?>
<!-- Android 13+ themed icon layer: single colour, launcher tints it. Same geometry as the
     foreground; the accent cell is solid so it stays distinct from the outlined cells. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <g transform="translate(237 237) scale(5.5)">
    <g fill="none" stroke="#ffffff" stroke-width="5">
      <rect x="24" y="24" width="23" height="23" rx="6"/>
      <rect x="53" y="24" width="23" height="23" rx="6"/>
      <rect x="24" y="53" width="23" height="23" rx="6"/>
    </g>
    <rect x="53" y="53" width="23" height="23" rx="6" fill="#ffffff" stroke="#ffffff" stroke-width="5"/>
  </g>
</svg>
